domain: chb
task: detection

data:
  dataset: chbmit
  root: /mnt/data13_16T/public_EEG/CHB-MIT/1.0.0
  num_workers: 8
  pin_memory: true

chb:
  cache:
    root: /mnt/data12_16T/andre/cache
    name: chb_detection_v1
  window_seconds: 5.0
  stride_seconds: 2.5
  resample_hz: 256
  bandpass_hz: [0.5, 40.0]
  notch_hz: 60
  normalization: zscore_per_channel_train_only
  patient_split:
    strategy: heldout_patients
    test_patients: "AUTO"
    val_fraction_within_train_patients: 0.2

model:
  name: eeg_cnn_1d
  in_channels: "AUTO"
  num_classes: 2

training:
  batch_size: 256
  max_epochs: 50
  grad_clip_norm: 1.0
  pos_weight: "AUTO"
  early_stopping: true
  early_stopping_patience_epochs: 20

optimizer:
  name: sam_adamw
  params:
    rho: 0.05
    adaptive: false
    base_params:
      lr: 0.001
      betas: [0.9, 0.999]
      eps: 1.0e-8
      weight_decay: 0.01

scheduler:
  name: cosine
  params:
    warmup_epochs: 3
    min_lr: 0.0

metrics:
  primary: auc

stress_tests:
  noise_snr_db: [20, 10]
  channel_dropout_k: [2, 4]